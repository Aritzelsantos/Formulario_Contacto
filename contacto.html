<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f8fc;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #2b6f9e;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .comentario {
            grid-column: 1 / 3;
        }

        .captcha {
            grid-column: 1 / 3;
            background-color: #eaf6ff;
            padding: 15px;
            border-radius: 8px;
        }

        .boton {
            grid-column: 1 / 3;
            text-align: center;
        }

        button {
            background-color: #00a000;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #008000;
        }

        .mapa {
            margin-top: 30px;
        }

        .mapa h2 {
            color: #2b6f9e;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .formulario {
                grid-template-columns: 1fr;
            }

            .comentario,
            .captcha,
            .boton {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Formulario de Contacto</h1>

        <form class="formulario" id="formulario">

            <div class="campo">
                <label>Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required>
            </div>

            <div class="campo">
                <label>Teléfono:</label>
                <input
                    type="tel"
                    id="telefono"
                    placeholder="Escribe tu teléfono"
                    required>
            </div>

            <div class="campo">
                <label>Correo:</label>
                <input
                    type="email"
                    id="correo"
                    placeholder="Escribe tu correo"
                    required>
            </div>

            <div class="campo comentario">
                <label>Comentario:</label>
                <textarea
                    id="comentario"
                    placeholder="Escribe tu comentario"
                    required></textarea>
            </div>

            <div class="captcha">
                <label>
                    <input type="checkbox" id="robot" required>
                    No soy un robot
                </label>
            </div>

            <div class="boton">
                <button type="submit">
                    Enviar por WhatsApp
                </button>
            </div>

        </form>

        <div class="mapa">
            <h2>Ubicación UATV</h2>

            <iframe
                src="https://www.google.com/maps?q=UATU%20Tulcingo%20de%20Valle%20Puebla&output=embed"
                loading="lazy">
            </iframe>
        </div>

    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {

            event.preventDefault();

            const nombre = document.getElementById("nombre").value;
            const telefono = document.getElementById("telefono").value;
            const correo = document.getElementById("correo").value;
            const comentario = document.getElementById("comentario").value;

            // CAMBIA ESTE NÚMERO POR EL WHATSAPP QUE RECIBIRÁ LOS MENSAJES
            const numeroWhatsApp = "7571299189";

            const mensaje =
                "FORMULARIO DE CONTACTO%0A%0A" +
                "Nombre: " + encodeURIComponent(nombre) + "%0A" +
                "Teléfono: " + encodeURIComponent(telefono) + "%0A" +
                "Correo: " + encodeURIComponent(correo) + "%0A" +
                "Comentario: " + encodeURIComponent(comentario);

            const enlace =
                "https://wa.me/" + numeroWhatsApp + "?text=" + mensaje;

            window.open(enlace, "_blank");
        });
    </script>

</body>
</html>
